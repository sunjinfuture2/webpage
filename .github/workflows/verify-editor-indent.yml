name: Verify editor indentation
on:
  push:
    branches: ['codex/main-editor-indent']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: aidc-workspace-new
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/indent-browser.mjs
      - run: npm run build
      - name: Test persistence against isolated local worker
        run: |
          trap 'cat "$RUNNER_TEMP/indent-worker.log"' EXIT
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/indent-worker.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8787/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/indent-persistence.cjs
