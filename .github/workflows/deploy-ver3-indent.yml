name: Deploy ver3 paragraph indentation
on:
  push:
    branches: [main]
    paths: ['tools/deploy-ver3-indent.mjs', '.github/workflows/deploy-ver3-indent.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-workspace-ver3
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build and test ver3 editor
        working-directory: workspace_ver3
        run: |
          npm ci --no-audit --no-fund
          node tests/indent.mjs
          npm run build
      - name: Replace only ver3 editor assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: node tools/deploy-ver3-indent.mjs
