name: Review five trial results
on:
  push:
    branches: ['codex/ai-five-format-tests']
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ai-five-layout-tests
          run-id: 45527225832
          github-token: ${{ github.token }}
          path: results
      - name: Review saved analysis without new API calls
        run: |
          python - <<'PY'
          import json, pathlib
          for p in sorted(pathlib.Path('results').glob('*.report.json')):
            r=json.loads(p.read_text())['report']
            for s in r['sections']: s.pop('refs',None)
            print('REPORT',p.name,json.dumps(r,ensure_ascii=False))
          PY
