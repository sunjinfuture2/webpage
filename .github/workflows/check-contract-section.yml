name: Check project contract section
on:
  push:
    branches: ['codex/project-contract-section']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: aidc-workspace-new
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node tests/contract-live-check.cjs
