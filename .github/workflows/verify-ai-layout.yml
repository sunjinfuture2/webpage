name: Three live Fable trials
on:
  push:
    branches: ['codex/ai-fable-layout']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: aidc-workspace-new
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1 pptxgenjs docx
      - run: npx playwright install --with-deps chromium
      - run: node tests/ai-fable-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-fable-three-trials
          path: aidc-workspace-new/test-results/ai-five
