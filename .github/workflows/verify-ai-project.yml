name: Verify AI project trial
on:
  push:
    branches: ['codex/ai-project-test']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: aidc-workspace-new
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/ai-project.test.mjs
      - run: npm run build
      - name: Isolated full app verification
        run: |
          trap 'tail -n 50 "$RUNNER_TEMP/ai-worker.log"' EXIT
          npx wrangler dev --local --compatibility-date 2026-10-13 --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/ai-worker.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8787/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/ai-project-browser.cjs
