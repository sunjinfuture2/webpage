name: Capture PDF layout trial
on:
  push:
    branches: ['codex/ai-overview-cleanup']
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aidc-workspace-new
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-nanum
      - run: pip install reportlab
      - run: python tests/make-capture-pdf.py
      - run: node tests/capture-pdf-live.cjs
        env:
          TRIAL_LIMIT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-pdf-trial
          path: aidc-workspace-new/test-results/capture
