name: Copy live v2 to isolated ver3
on:
  push:
    branches: [main]
    paths:
      - 'tools/clone-live-v2-to-ver3.mjs'
      - '.github/workflows/clone-live-v2-to-ver3.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-workspace-ver3
  cancel-in-progress: false
jobs:
  clone:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aidc-workspace-new/package-lock.json
      - name: Build asset inventory
        working-directory: aidc-workspace-new
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Copy deployed modules and assets and verify independent storage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/clone-live-v2-to-ver3.mjs
